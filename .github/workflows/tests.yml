name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Playback goes through playback.py (sounddevice/PortAudio) instead of
    # the Windows-only `winsound` module, so kokoro_engine.py no longer
    # forces Windows-only. ubuntu-latest additionally needs libportaudio2
    # (system PortAudio lib `sounddevice` dlopens). The GUI suite is Qt-only
    # now (kokoro_gui/qt/) and runs headless via QT_QPA_PLATFORM=offscreen,
    # so no Xvfb/virtual display is needed on either OS.
    # macos-latest is left out for now (unverified) - see ROADMAP.md's
    # "CI expansion" item.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PortAudio (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run fast test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest
        # Runs the mocked-pipeline suite only (pytest.ini already sets
        # `-m "not integration"` by default). No eSpeak NG or model
        # download needed. The real-synthesis integration suite
        # (`pytest -m integration tests/integration`) is intentionally
        # left out of CI - it's slow and pulls model weights.
        # QT_QPA_PLATFORM=offscreen lets the Qt suite (tests/gui_qt/) build
        # real widgets with no display attached.
