name: Tests

on:
  push:
    branches: [main]
  pull_request:

# The token only ever reads the checkout; nothing here pushes or comments.
permissions:
  contents: read

# A new push to the same branch/PR cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Playback goes through playback.py (sounddevice/PortAudio) instead of
    # the Windows-only `winsound` module, so kokoro_engine.py no longer
    # forces Windows-only. ubuntu-latest additionally needs libportaudio2
    # (system PortAudio lib `sounddevice` dlopens) and the shared libraries
    # PySide6's QtGui links against (libEGL, libGL, xkbcommon, fontconfig,
    # dbus), which the runner image doesn't ship. The GUI suite is Qt-only
    # now (kokoro_gui/qt/) and runs headless via QT_QPA_PLATFORM=offscreen,
    # so no Xvfb/virtual display is needed on either OS.
    # macos-latest is left out for now (unverified) - see ROADMAP.md's
    # "CI expansion" item.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # torch alone is several hundred MB; keyed on both requirements files.
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install PortAudio and Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run fast test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest
        # Runs the mocked-pipeline suite only (pytest.ini already sets
        # `-m "not integration"` by default). No eSpeak NG or model
        # download needed. The real-synthesis integration suite
        # (`pytest -m integration tests/integration`) is intentionally
        # left out of CI - it's slow and pulls model weights.
        # QT_QPA_PLATFORM=offscreen lets the Qt suite (tests/gui_qt/) build
        # real widgets with no display attached.
