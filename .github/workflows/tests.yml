name: Tests

on:
  push:
    branches: [main]
  pull_request:

# The token only ever reads the checkout; nothing here pushes or comments.
permissions:
  contents: read

# A new push to the same branch/PR cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # This job runs the engine, DAW model and audio suites only. tests/gui_qt/
    # (real QtTTSApp widgets, docks, screenshots) has its own non-required
    # `gui` job below. Nothing collected here imports PySide6.QtGui or QtWidgets
    # (tests/test_mixer_transport.py needs QtCore only), so the Linux leg
    # needs no Qt runtime libraries and no QT_QPA_PLATFORM. It still needs
    # libportaudio2, the system PortAudio library `sounddevice` dlopens.
    # macOS needs brew's portaudio. torch 2.13.0 and pedalboard 0.9.23 both
    # ship macOS arm64 wheels for Python 3.11.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          # torch alone is several hundred MB; keyed on both requirements files.
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install PortAudio (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2

      - name: Install PortAudio (macOS)
        if: runner.os == 'macOS'
        run: brew install portaudio

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run non-GUI test suite
        # -X faulthandler from interpreter start: pytest's own faulthandler
        # only switches on at pytest_configure, after tests/conftest.py
        # (and torch, pedalboard with it) has already been imported, so a
        # native crash during those imports printed nothing.
        # --ignore=tests/gui_qt leaves the Qt suite out (its conftest builds
        # the whole app). -p no:pytest-qt keeps the pytest-qt plugin from
        # importing QtGui/QtWidgets at configure time, which it does even
        # when no test uses qtbot.
        run: python -X faulthandler -m pytest --ignore=tests/gui_qt -p no:pytest-qt
        # pytest.ini already deselects `integration` and `slow`. No eSpeak
        # NG or model download needed. The real-synthesis integration suite
        # (`pytest -m integration tests/integration`) is intentionally
        # left out of CI - it's slow and pulls model weights.

  gui:
    # The Qt widget suite (tests/gui_qt/, about 1,500 tests that build a real
    # QtTTSApp). Its own job and its own pytest process: its conftest builds
    # the whole app and sets QT_QPA_PLATFORM at import, so it can't share a
    # process with the non-GUI files (the test job runs those with
    # -p no:pytest-qt, and mixing the two in one call broke the qt_app
    # fixture through collection order). continue-on-error keeps a red run
    # here from failing the check on a pull request; it is not a required
    # check. Linux only until it has run green and under 15 minutes.
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    env:
      # offscreen needs no display server, only the QtGui libraries below.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install system libraries
        # libportaudio2: sounddevice dlopens it. The rest are what PySide6's
        # QtGui and the offscreen platform plugin link against. If PySide6
        # reports another missing library, its error names the package to add
        # (libxkbcommon-x11-0 or libxcb-cursor0 for the xcb plugin).
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run Qt widget suite
        # --durations lists the slowest tests in the log, so a regression in
        # run time shows up without opening a profiler.
        run: python -X faulthandler -m pytest tests/gui_qt --durations=15

  lint:
    # ruff.toml selects syntax errors, undefined names, unused imports and
    # variables, and mutable defaults. No formatter, nothing auto-fixed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.17.6

      - name: Run ruff
        run: ruff check .
